<svg xmlns="http://www.w3.org/2000/svg" width="940" height="588" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" viewBox="0 0 940 588"><title>How the 10 cross-lingual test questions were chosen</title><desc>Thirty-three real questions were written by authors who could not see our source list. Thirty-two had an answer findable on the open web. Thirteen had one exact sentence that proves the answer and survived every check. Ten form the final test set. Between the rows, every dropped question is counted with its reason. A ten-square strip shows one verification run per final question: the answer sentence came back for one, the right page without the sentence for four, and the page was not in the top ten for five.</desc><rect width="940" height="588" fill="#0F172A"/><text x="34" y="42" fill="#E2E8F0" font-size="20" font-weight="600">How the 10 cross-lingual test questions were chosen</text><text x="34" y="68" fill="#94A3B8" font-size="13.5">The authors wrote 33 real questions without seeing our source list; the checks below cut them to 10.</text><text x="34" y="106" fill="#E2E8F0" font-size="14" font-weight="600">Questions written</text><rect width="560" height="30" x="34" y="118" fill="#334155" opacity=".45" rx="7"/><rect width="560" height="30" x="34" y="118" fill="#93C5FD" rx="7"/><text x="610" y="139" fill="#E2E8F0" font-size="18" font-weight="700">33</text><text x="48" y="172" fill="#94A3B8" font-size="12.5">1 dropped: its author already knew the answer. 0 lacked a findable answer.</text><text x="34" y="202" fill="#E2E8F0" font-size="14" font-weight="600">Answers found on the open web</text><rect width="560" height="30" x="34" y="214" fill="#334155" opacity=".45" rx="7"/><rect width="543" height="30" x="34" y="214" fill="#3B82F6" rx="7"/><text x="610" y="235" fill="#E2E8F0" font-size="18" font-weight="700">32</text><text x="48" y="268" fill="#94A3B8" font-size="12.5">19 dropped: no single sentence settles the question (10), the sentence changes</text><text x="48" y="286" fill="#94A3B8" font-size="12.5">depending on how the page is fetched (5), it also appears elsewhere (3), login required (1).</text><text x="34" y="316" fill="#E2E8F0" font-size="14" font-weight="600">Answers provable by one exact sentence</text><rect width="560" height="30" x="34" y="328" fill="#334155" opacity=".45" rx="7"/><rect width="220.6" height="30" x="34" y="328" fill="#2563EB" rx="7"/><text x="610" y="349" fill="#E2E8F0" font-size="18" font-weight="700">13</text><text x="48" y="382" fill="#94A3B8" font-size="12.5">3 dropped in the final review, each with a recorded reason.</text><text x="34" y="412" fill="#E2E8F0" font-size="14" font-weight="600">Final test set</text><rect width="560" height="30" x="34" y="424" fill="#334155" opacity=".45" rx="7"/><rect width="169.7" height="30" x="34" y="424" fill="#FBBF24" rx="7"/><text x="610" y="445" fill="#E2E8F0" font-size="18" font-weight="700">10</text><text x="34" y="494" fill="#E2E8F0" font-size="14" font-weight="600">Each final question was then run through OmniSeek once (2026-08-22):</text><rect width="24" height="24" x="34" y="510" fill="#334155" rx="6"/><text x="46" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">001</text><rect width="24" height="24" x="66" y="510" fill="#334155" rx="6"/><text x="78" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">002</text><rect width="24" height="24" x="98" y="510" fill="#3B82F6" rx="6"/><text x="110" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">003</text><rect width="24" height="24" x="130" y="510" fill="#FBBF24" rx="6"/><text x="142" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">004</text><rect width="24" height="24" x="162" y="510" fill="#334155" rx="6"/><text x="174" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">005</text><rect width="24" height="24" x="194" y="510" fill="#3B82F6" rx="6"/><text x="206" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">006</text><rect width="24" height="24" x="226" y="510" fill="#334155" rx="6"/><text x="238" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">007</text><rect width="24" height="24" x="258" y="510" fill="#3B82F6" rx="6"/><text x="270" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">008</text><rect width="24" height="24" x="290" y="510" fill="#3B82F6" rx="6"/><text x="302" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">009</text><rect width="24" height="24" x="322" y="510" fill="#334155" rx="6"/><text x="334" y="549" fill="#94A3B8" font-size="10" text-anchor="middle">010</text><rect width="11" height="11" x="380" y="507" fill="#FBBF24" rx="3"/><text x="398" y="517" fill="#94A3B8" font-size="12.5">Answer sentence returned (1)</text><rect width="11" height="11" x="380" y="527" fill="#3B82F6" rx="3"/><text x="398" y="537" fill="#94A3B8" font-size="12.5">Right page returned, answer sentence missing (4)</text><rect width="11" height="11" x="380" y="547" fill="#334155" rx="3"/><text x="398" y="557" fill="#94A3B8" font-size="12.5">Right page not in the top 10 (5)</text></svg>